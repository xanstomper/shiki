name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: python3 -m py_compile scripts/shiki.py

      - name: CLI smoke tests
        run: |
          set -e
          S=scripts/shiki.py
          python3 $S --help > /dev/null
          python3 $S verify > /dev/null 2>&1 || test $? -eq 1   # fresh clone: engines not installed yet
          python3 $S verify 2>&1 | grep -q 'family engine barbican missing'
          python3 $S assault --target demo --domain demo.com --plan-only | grep -q 'GATE'
          python3 $S assault --target demo --domain demo.com --url https://demo.com --plan-only | grep -q 'DESCEND'
          python3 $S assault --target demo --domain demo.com --plan-only --skip gate,forge | grep -q 'SKIPPED'
          python3 $S gate --target demo 2>/dev/null || test $? -eq 1   # shield missing in isolated HOME
          python3 $S validate --target demo | grep -q 'VALIDATE'
          python3 $S handoff --target demo --to kaisha | grep -q 'kaisha ladder'
          for c in assault board plan lane fires report verify warroom gate handoff validate; do
            python3 $S --help | grep -q "$c"
          done
          test -f templates/ops-state.json
          test -f references/operations-playbook.md

      - name: Stdlib-only check
        run: |
          ! grep -E '^[[:space:]]*(import|from)[[:space:]]+(requests|flask|httpx|aiohttp|urllib3)' scripts/shiki.py
